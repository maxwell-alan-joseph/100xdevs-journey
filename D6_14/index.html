<html>
    <head> 
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"> </script>
    </head>

    <body>

        <div  style = "display: flex; padding: 30px 100px; justify-content: space-between;">
            <div id="notesDiv">
                Loading Notes...
            </div>

            <div>
                <input id="userNote" type="text" placeholder="Your new Note" />
                <button onclick="createToDo()">Submit</button>
            </div>
        </div>

        <script>
            
            async function getNotes(){
                const response = await axios.get("http://localhost:3000/notes");
                const notesDbFrontend = response.data.notesDb;

                document.getElementById("notesDiv").innerHTML = "";

                for (let i = 0; i <= notesDbFrontend.lenght; i++) {
                    const fetchAllNotes = document.createElemet("div");
                    fetchAllNotes.innerHTML = notesDbFrontend[i];
                    document.getElementById("notesDiv").appendChild(fetchAllNotes);
                }
            }
            getNotes()
        </script>

    </body>

    
</html>
